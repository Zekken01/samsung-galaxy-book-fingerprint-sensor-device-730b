name: release-deb

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            meson \
            ninja-build \
            pkg-config \
            libusb-1.0-0-dev \
            libglib2.0-dev \
            libgusb-dev \
            libfprint-2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Debian package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/release/build-deb.sh --version "$VERSION"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
